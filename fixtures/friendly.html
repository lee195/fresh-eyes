<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create your account — Acme</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        color: #1a1a1a;
        background: #fff;
        font-size: 16px;
      }
      .wrap { max-width: 520px; margin: 0 auto; padding: 48px 24px 120px; }
      h1 { font-size: 28px; margin: 0 0 8px; }
      .sub { color: #4a4a4a; margin: 0 0 28px; font-size: 17px; }
      .price {
        background: #f1f7f1;
        border: 1px solid #cfe3cf;
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 28px;
      }
      .price strong { display: block; font-size: 18px; margin-bottom: 2px; }
      .price span { color: #3a5a3a; }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      .hint { display: block; font-weight: 400; color: #5a5a5a; font-size: 14px; margin-bottom: 6px; }
      input {
        width: 100%;
        padding: 12px;
        margin-bottom: 22px;
        border: 1px solid #b9b9b9;
        border-radius: 6px;
        font-size: 16px;
      }
      button {
        background: #1f6f43;
        color: #fff;
        border: none;
        padding: 14px 24px;
        border-radius: 6px;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
      }
      .after { color: #4a4a4a; font-size: 15px; margin-top: 16px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Create your account</h1>
      <p class="sub">It takes about a minute. You can start using Acme straight away.</p>

      <div class="price">
        <strong>Free for 30 days</strong>
        <span>No card needed. We'll email you a week before the trial ends.</span>
      </div>

      <form>
        <label for="email">Your email address</label>
        <span class="hint" id="email-hint">We'll send your sign-in link here.</span>
        <input id="email" type="email" aria-describedby="email-hint" />

        <label for="password">Choose a password</label>
        <span class="hint" id="pw-hint">At least 8 characters.</span>
        <input id="password" type="password" aria-describedby="pw-hint" />

        <button type="submit">Create my account</button>
      </form>

      <p class="after">Already have an account? <a href="#signin">Sign in instead</a></p>
    </div>
  </body>
</html>
